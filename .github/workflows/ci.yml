name: CI Pipeline

on:
  push:
    branches:
      - main  # pipeline se spustí při každém pushi do main
  pull_request:
    branches:
      - main  # pipeline will run when pulling - merging to main

permissions:
  contents: read
  packages: write  # this allows me to push the image to GHCR using GITHUB_TOKEN

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ------------------------------------------
      # Python setup
      # ------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r app/requirements.txt
          pip install pytest  # this is for Github runner

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest app/tests

      # --------------------------------------------
      # Build local Docker image - just for testing
      # --------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t dafnefirstapp:latest -f docker/Dockerfile .

      # --------------------------------------------
      # Smoke test of the Docker container
      # --------------------------------------------
      - name: Test Docker container functionality
        run: |
          docker run -d --name dafneapp -p 5000:5000 dafnefirstapp:latest
          echo "Waiting for container to be ready..."
          for i in {1..15}; do
            if curl -f http://localhost:5000/health; then
              echo "Container is up and responding!"
              break
            fi
            echo "Waiting for HTTP response..."
            sleep 1
            if [ $i -eq 15 ]; then
              echo "Container failed to start or respond to health check"
              docker logs dafneapp
              docker stop dafneapp
              docker rm dafneapp
              docker rmi dafnefirstapp
              exit 1
            fi
          done
          docker stop dafneapp
          docker rm dafneapp
          docker rmi dafnefirstapp

      # -----------------------------------------------
      # Log in to GHCR (GitHub Container Registry)
      # -----------------------------------------------    
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------
      # Build & push final Docker image - for pushing to GHCR
      # In this step we are setting also a tag to the image
      # ------------------------------------------------      
      - name: Build & push production image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          echo "Building image $IMAGE"
          docker build --cache-from dafnefirstapp:latest -t $IMAGE -f docker/Dockerfile .
          docker push $IMAGE
      
      # -------------------------------------------------
      # Export image tag for CD - saving the value of the image's tag
      # to the variable so that CD (or other job) knows which tag has
      # the image we have just pushed to the registry.
      # -------------------------------------------------
      - name: Set output tag
        id: image
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

# -------------------------------------------------------------
# Optional staging deploy via Docker compose
# -------------------------------------------------------------
      - name: Run container on Github runner using Docker compose
        if: github.ref == 'refs/heads/main'
        run: |
          docker compose -f docker-compose.yml up -d
          echo "Waiting for services to be ready..."
          for i in {1..15}; do
            if curl -f http://localhost:5000/health; then
              echo "Compose services are up!"
              break
            fi
            echo "Waiting for http response..."
            sleep 1
            if [ $i -eq 15 ]; then
              echo "Compose services failed to start or respond"
              docker compose down
              exit 1
            fi
          done
