name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # pipeline se spustí při každém pushi do main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r app/requirements.txt
          pip install pytest  # this is for Github runner

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest app/tests

      - name: Build Docker image
        run: |
          docker build -t dafnefirstapp:latest -f docker/Dockerfile .

